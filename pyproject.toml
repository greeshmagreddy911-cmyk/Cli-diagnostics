[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-diagnostics"
version = "1.1.0"
description = "Deterministic command-line diagnostics for Python developer machines."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "G Greeshma Reddy"}]

[project.scripts]
cli-diagnostics = "cli_diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
